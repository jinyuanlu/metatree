# ci.yml — runs on every push and PR. Required to merge.
#
# Runs on macOS only: tmux + path-length quirks exercised by tests/smoke.sh
# are macOS-specific. A linux runner can be added later when we're confident
# the smoke harness is portable.
#
# Smoke wiring:
#   tests/smoke.sh currently hardcodes `MT="$MT_DIR/mt.sh"`. Rather than edit
#   smoke.sh from CI (it lives in tests/ and we want it to stay verbatim),
#   we copy it to a tmp path and sed-rewrite the one line so MT honors an
#   environment override. Then we point MT at the freshly-built Go binary.
#   Once smoke.sh is updated upstream to read $MT from the environment, the
#   sed step can be dropped.

name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: install tmux + fzf
        run: brew install tmux fzf

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needs to be run on:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test -race ./...

      - name: build mt binary
        # Stamp version+commit+date so the smoke step (and any debug user
        # who pokes the binary) sees what commit it came from. Mirrors
        # goreleaser's ldflags in .goreleaser.yaml — keep them in sync.
        run: |
          version="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          commit="$(git rev-parse HEAD)"
          date="$(git show -s --format=%cI HEAD)"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${version} -X main.commit=${commit} -X main.date=${date}" \
            -o ./bin/mt-go ./cmd/mt
          ./bin/mt-go --version

      - name: smoke
        run: |
          # Wrap smoke.sh so MT points at the just-built Go binary.
          # smoke.sh has `MT="$MT_DIR/mt.sh"` hardcoded; rewrite that one line
          # to honor an environment override, then run from the tmp copy.
          cp tests/smoke.sh /tmp/smoke.sh
          sed -i '' 's|MT="$MT_DIR/mt.sh"|MT="${MT:-$MT_DIR/mt.sh}"|' /tmp/smoke.sh
          MT="$PWD/bin/mt-go" bash /tmp/smoke.sh

      - name: auth invariant — no credential refs in production source
        # Central promise of mt: never read Anthropic credentials. This step
        # fails the build if any non-comment .go line in production code
        # (cmd/, internal/) mentions ANTHROPIC_ or credentials.json.
        #
        # tests/ is exempt: TestAuthInvariantNoCredentialRefs in
        # tests/integration_test.go has to mention these strings literally to
        # assert they're absent in production. Same exemption the test itself
        # applies internally.
        #
        # Comment lines (// ...) are also allowed in production code so we
        # can document what we DON'T do. The filter strips the `file:line:`
        # prefix grep -rn produces, then checks whether the remaining content
        # starts with `//`.
        run: |
          set +e  # grep returns 1 on no-match — that's success here
          matches=$(grep -rnE '(ANTHROPIC_|credentials\.json)' \
            --include='*.go' cmd/ internal/ \
            | awk -F: '{
                # $1=file, $2=line, $3+=content. Print only lines whose content
                # is not a // or /* comment.
                content = $3
                for (i = 4; i <= NF; i++) content = content ":" $i
                sub(/^[ \t]+/, "", content)
                if (content !~ /^\/\//  &&  content !~ /^\*/) print
              }')
          if [ -n "$matches" ]; then
            echo "ERROR: non-comment reference to credentials.json or ANTHROPIC_ in production Go source"
            echo "$matches"
            exit 1
          fi
